<title>은빛실타래 설계발표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;900&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ============ Design Tokens — 은빛실타래 BI 가이드 기반, 단일 라이트 테마 ============ */
  :root{
    --paper:#F4F2EE; --surface:#FFFFFF; --subtle:#ECE8E1; --subtle2:#F7F5F1;
    --border:#DEDACF; --border-strong:#B7AD9B;
    --ink:#20242B; --ink-muted:#4A525E; --ink-faint:#70767F;
    --silver:#8E97A6; --silver-deep:#4B5563;
    --teal:#1E7A8C; --teal-deep:#155C6B; --teal-tint:#E4F0F2;
    --gold:#B8935A; --gold-deep:#8A6A3C; --gold-tint:#F3E9D8;
    --red:#A23F35; --red-tint:#F5E3E1;
    --green:#33684C; --green-tint:#E1EDE6;
    --font-serif:'Noto Serif KR', 'Nanum Myeongjo', serif;
    --font-sans:'Pretendard', -apple-system, 'Malgun Gothic', sans-serif;
    --font-mono: ui-monospace, 'SF Mono', Consolas, 'Nanum Gothic Coding', monospace;
    --stage-w:1920px; --stage-h:1080px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--ink);
    font-family:var(--font-sans);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  ::selection{background:var(--teal-tint); color:var(--teal-deep);}

  /* ============ Stage scaffolding ============ */
  #stage-outer{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 20% -10%, #2a3140 0%, transparent 55%),
      radial-gradient(ellipse at 100% 110%, #1a3c42 0%, transparent 50%),
      var(--ink);
  }
  #stage{
    width:var(--stage-w); height:var(--stage-h);
    position:relative; background:var(--paper);
    box-shadow:0 40px 120px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.2);
    transform-origin:center center;
    overflow:hidden;
    flex:0 0 auto;
  }
  #slide-root{position:absolute; inset:0;}

  .slide{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    padding:64px 96px 108px 96px;
    opacity:0; transform:translateY(22px);
  }
  .slide.active{
    opacity:1; transform:none;
    transition:opacity .5s cubic-bezier(.2,.8,.2,1), transform .5s cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-reduced-motion: reduce){
    .slide{transition:none !important; transform:none !important;}
    [data-step]{transition:none !important;}
  }

  /* keep-all: 한글 단어/조사 단위 줄바꿈 보존 */
  .slide, .slide *{ word-break:keep-all; overflow-wrap:break-word; line-break:strict; }

  /* ============ Header (kicker + title) ============ */
  .hd{margin-bottom:34px; flex:0 0 auto;}
  .kicker{
    font-family:var(--font-sans); font-weight:700; font-size:22px; letter-spacing:.14em;
    color:var(--teal-deep); text-transform:uppercase; margin:0 0 14px 0;
  }
  .title{
    font-family:var(--font-serif); font-weight:700; font-size:54px; line-height:1.28;
    color:var(--ink); margin:0; text-wrap:balance; letter-spacing:-.01em;
  }
  .subtitle{ font-family:var(--font-sans); font-weight:500; font-size:26px; color:var(--ink-muted); margin:14px 0 0 0; }

  .content{flex:1 1 auto; min-height:0; display:flex; flex-direction:column;}

  /* ============ Reveal mechanics ============ */
  [data-step]{
    opacity:0; transform:translateY(18px);
  }
  [data-step].shown{
    opacity:1; transform:none;
  }
  @media (prefers-reduced-motion: no-preference){
    [data-step]{ transition:opacity .45s cubic-bezier(.2,.8,.2,1), transform .45s cubic-bezier(.2,.8,.2,1); }
  }

  /* ============ Bullets ============ */
  .b-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:22px; overflow-y:auto; }
  .b-item{ position:relative; padding-left:40px; font-size:32px; line-height:1.55; color:var(--ink); font-weight:500; }
  .b-item::before{
    content:'▸'; position:absolute; left:0; top:2px; color:var(--teal); font-size:28px;
  }
  .b-item.lvl1{ font-size:26px; padding-left:70px; color:var(--ink-muted); font-weight:400; }
  .b-item.lvl1::before{ content:'—'; left:38px; color:var(--silver-deep); font-size:22px; }
  .b-item.tone-accent{ color:var(--teal-deep); font-weight:700; }
  .b-item.tone-accent::before{ color:var(--teal-deep); }
  .b-item.tone-warn{ color:var(--gold-deep); font-weight:700; }
  .b-item.tone-warn::before{ color:var(--gold-deep); content:'⚠'; }
  .b-item.tone-crit{ color:var(--red); font-weight:700; }
  .b-item.tone-crit::before{ color:var(--red); content:'✕'; }
  .b-item.tone-good{ color:var(--green); font-weight:700; }
  .b-item.tone-good::before{ color:var(--green); content:'✓'; }

  .note{ margin-top:26px; padding:16px 22px; background:var(--gold-tint); border-left:5px solid var(--gold); border-radius:4px; font-size:22px; color:var(--gold-deep); font-weight:600; }
  .note.crit{ background:var(--red-tint); border-color:var(--red); color:var(--red); }

  /* ============ Two-column ============ */
  .twocol{ display:grid; grid-template-columns:1fr 1fr; gap:56px; flex:1; min-height:0; }
  .col{ background:var(--surface); border:1.5px solid var(--border-strong); border-radius:14px; padding:34px 38px; display:flex; flex-direction:column; min-height:0; }
  .col-label{ font-family:var(--font-sans); font-weight:800; font-size:24px; letter-spacing:.03em; margin:0 0 20px 0; padding-bottom:14px; border-bottom:2px solid var(--border); }
  .col.left .col-label{ color:var(--teal-deep); }
  .col.right .col-label{ color:var(--red); }
  .col .b-list{ gap:16px; }
  .col .b-item{ font-size:24px; padding-left:34px; }
  .col .b-item::before{ font-size:20px; top:3px; }
  .col .b-item.lvl1{ font-size:21px; padding-left:58px; }

  /* ============ Table ============ */
  .tbl-wrap{ flex:1; min-height:0; overflow:auto; border-radius:12px; border:1.5px solid var(--border-strong); }
  table.dt{ width:100%; border-collapse:collapse; background:var(--surface); font-size:24px; }
  table.dt th{
    background:var(--ink); color:var(--surface); text-align:left; font-weight:700;
    padding:16px 22px; font-size:22px; letter-spacing:.02em; position:sticky; top:0;
  }
  table.dt td{ padding:15px 22px; border-top:1px solid var(--border); color:var(--ink); vertical-align:top; font-variant-numeric:tabular-nums; }
  table.dt tr:nth-child(even) td{ background:var(--subtle2); }
  table.dt tr[data-step]{ }
  table.dt td.hl{ color:var(--teal-deep); font-weight:700; }
  table.dt td.crit{ color:var(--red); font-weight:700; }
  table.dt td.center{ text-align:center; }

  /* ============ Flow (vertical & horizontal) ============ */
  .flow-v{ display:flex; flex-direction:column; gap:14px; flex:1; justify-content:center; max-width:1500px; margin:0 auto; width:100%; }
  .flow-step{ display:flex; align-items:center; gap:24px; background:var(--surface); border:1.5px solid var(--border-strong); border-radius:12px; padding:18px 28px; position:relative; }
  .flow-num{ flex:0 0 auto; width:56px; height:56px; border-radius:50%; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-serif); font-weight:700; font-size:26px; }
  .flow-body{ flex:1; }
  .flow-title{ font-size:26px; font-weight:700; color:var(--ink); margin:0; }
  .flow-desc{ font-size:20px; color:var(--ink-muted); margin:4px 0 0 0; }
  .flow-chevron{ text-align:center; color:var(--gold); font-size:26px; margin:-3px 0; }

  .flow-h{ display:flex; align-items:stretch; gap:0; flex:1; }
  .flow-h-step{ flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding:0 8px;}
  .flow-h-badge{ width:64px; height:64px; border-radius:50%; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-serif); font-weight:700; font-size:28px; }
  .flow-h-title{ font-size:23px; font-weight:700; color:var(--ink); }
  .flow-h-desc{ font-size:18px; color:var(--ink-muted); line-height:1.4; }
  .flow-h-arrow{ flex:0 0 44px; display:flex; align-items:center; justify-content:center; color:var(--gold); font-size:30px; align-self:flex-start; margin-top:22px; }

  /* ============ Diagram (freeform boxes + svg arrows) ============ */
  .diagram{ position:relative; flex:1; }
  .dbox{
    position:absolute; border-radius:12px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:14px;
    font-size:22px; font-weight:700; line-height:1.35; border:1.5px solid var(--border-strong);
    background:var(--surface); color:var(--ink);
  }
  .dbox .sub{ font-weight:400; font-size:18px; color:var(--ink-muted); margin-top:6px; }
  .dbox.tone-teal{ background:var(--teal-tint); border-color:var(--teal); color:var(--teal-deep); }
  .dbox.tone-ink{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .dbox.tone-gold{ background:var(--gold-tint); border-color:var(--gold); color:var(--gold-deep); }
  .dbox.tone-subtle{ background:var(--subtle); border-color:var(--border-strong); color:var(--ink); }
  .dbox.label{ background:transparent; border:none; font-weight:800; font-size:24px; color:var(--ink); }
  .diagram svg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .diagram .arrow-lbl{ position:absolute; font-size:18px; font-weight:700; color:var(--gold-deep); background:var(--paper); padding:2px 8px; border-radius:6px; }

  /* ============ Code ============ */
  .code-wrap{ flex:1; background:#171B22; border-radius:14px; padding:32px 40px; overflow:auto; border:1px solid #2b323d; }
  .code-wrap pre{ margin:0; font-family:var(--font-mono); font-size:22px; line-height:1.55; color:#DCEEF1; white-space:pre; }
  .code-wrap .k{color:#7FD0DE;} .code-wrap .s{color:#E3C88C;}

  /* ============ Swatches ============ */
  .swatch-row{ display:flex; gap:26px; margin-bottom:40px; }
  .swatch{ flex:1; }
  .swatch-chip{ height:130px; border-radius:12px; border:1px solid rgba(0,0,0,.08); }
  .swatch-name{ font-weight:700; font-size:22px; margin-top:12px; }
  .swatch-hex{ font-size:18px; color:var(--ink-muted); font-family:var(--font-mono); }

  /* ============ Title / Section / Closing full slides ============ */
  .full-center{ flex:1; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; }
  .mark{ margin-bottom:28px; }
  .cover-eyebrow{ font-family:var(--font-sans); font-weight:700; font-size:24px; letter-spacing:.16em; color:var(--gold-deep); text-transform:uppercase; margin:0 0 22px 0; }
  .cover-title{ font-family:var(--font-serif); font-weight:900; font-size:104px; color:var(--ink); margin:0; line-height:1.1; letter-spacing:-.01em;}
  .cover-sub{ font-family:var(--font-sans); font-weight:600; font-size:34px; color:var(--teal-deep); margin:26px 0 0 0; }
  .cover-desc{ font-family:var(--font-sans); font-weight:400; font-size:24px; color:var(--ink-muted); margin:16px 0 0 0; max-width:1200px; line-height:1.6; }
  .cover-meta{ position:absolute; left:96px; bottom:64px; font-size:20px; color:var(--ink-faint); font-weight:500; }

  .sec-no{ font-family:var(--font-serif); font-weight:900; font-size:260px; color:var(--teal-tint); line-height:.8; margin:0; }
  .sec-title{ font-family:var(--font-serif); font-weight:700; font-size:72px; color:var(--ink); margin:-40px 0 0 0; text-wrap:balance; }
  .sec-sub{ font-family:var(--font-sans); font-weight:500; font-size:28px; color:var(--ink-muted); margin:20px 0 0 0; }
  .sec-rule{ width:120px; height:6px; background:var(--gold); border-radius:3px; margin-top:30px; }

  /* ============ Agenda ============ */
  .agenda-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px 60px; flex:1; align-content:center; }
  .agenda-item{ display:flex; align-items:baseline; gap:22px; padding:16px 0; border-bottom:1px solid var(--border); }
  .agenda-no{ font-family:var(--font-serif); font-weight:700; font-size:34px; color:var(--teal); width:64px; flex:0 0 auto; }
  .agenda-label{ font-size:29px; font-weight:600; color:var(--ink); }

  /* ============ Nav chrome ============ */
  #chrome{ position:absolute; left:0; right:0; bottom:0; height:96px; display:flex; align-items:center; padding:0 56px; gap:26px; background:linear-gradient(to top, rgba(244,242,238,.97), rgba(244,242,238,0)); z-index:20; }
  #part-label{ font-size:20px; font-weight:700; color:var(--ink-muted); letter-spacing:.04em; }
  #part-label b{ color:var(--teal-deep); }
  #progress-track{ flex:1; height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
  #progress-fill{ height:100%; background:var(--teal); border-radius:3px; transition:width .3s ease; }
  #counter{ font-size:20px; color:var(--ink-muted); font-weight:700; font-variant-numeric:tabular-nums; min-width:100px; text-align:right; }
  .navbtn{
    width:52px; height:52px; border-radius:50%; border:1.5px solid var(--border-strong); background:var(--surface);
    color:var(--ink); font-size:22px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .navbtn:hover{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .navbtn:focus-visible{ outline:3px solid var(--teal-deep); outline-offset:2px; }
  #hint{ position:absolute; right:56px; top:40px; font-size:18px; color:var(--ink-faint); font-weight:600; background:var(--surface); border:1px solid var(--border); padding:8px 16px; border-radius:20px; z-index:20; }
  #hint kbd{ background:var(--subtle); border-radius:4px; padding:1px 6px; font-family:var(--font-mono); }

  .scrollarea{ overflow-y:auto; }
</style>

<div id="stage-outer">
  <div id="stage">
    <div id="slide-root"></div>
    <div id="hint">방향키 <kbd>→</kbd> / <kbd>←</kbd> 로 진행 · <kbd>Esc</kbd> 전체화면</div>
    <div id="chrome">
      <button class="navbtn" id="btn-prev" aria-label="이전" title="이전 (←)">‹</button>
      <div id="part-label">PART <b id="part-no">0</b> · <span id="part-name">Cover</span></div>
      <div id="progress-track"><div id="progress-fill" style="width:0%"></div></div>
      <div id="counter">1 / 1</div>
      <button class="navbtn" id="btn-next" aria-label="다음" title="다음 (→)">›</button>
      <button class="navbtn" id="btn-full" aria-label="전체화면" title="전체화면">⛶</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   은빛실타래 (SilverYarn) 설계발표 슬라이드 — 데이터
   Source: docs/01-plan/*, docs/02-design/*, CLAUDE.md, CONVENTIONS.md
   ============================================================ */

const LOGO_SVG = (size, arcA, arcB, dot) => `
<svg width="${size}" height="${size}" viewBox="0 0 200 200" fill="none">
  <path d="M 100,50 A 50,50 0 1 1 50,100" stroke="${arcA}" stroke-width="9" stroke-linecap="round"/>
  <path d="M 100,134 A 34,34 0 1 1 134,100" stroke="${arcB}" stroke-width="7" stroke-linecap="round"/>
  <circle cx="100" cy="100" r="8" fill="${dot}"/>
</svg>`;

const PARTS = [

  "시스템 아키텍처",
  "분야별 프로세스",

  "CTO팀 검토",
  "로드맵 & 실행계획"

const SLIDES = [];

/* ---------------- 0. Cover & Agenda ---------------- */
SLIDES.push({part:0, type:'title',

  desc:'온디바이스(오프라인 우선) × 온프레미스 서버 하이브리드 아키텍처 — 설계문서 종합 발표자료',

/* ---------------- Part 1. 프로젝트 개요 ---------------- */
SLIDES.push({part:1, type:'section', no:'01', title:'프로젝트 개요', sub:'배경 · 목적 · 대상 사용자 · 서비스 컨셉'});

SLIDES.push({part:1, kicker:'Part 1 · 개요', title:'Executive Summary', type:'table',
  cols:['관점','내용'], colWidths:[18,82],
  rows:[
    ['Problem','고령화로 어르신 삶의 기록이 소실되고, 독거·정서적 고립으로 돌봄 공백 확대. 저사양/재활용 단말·비상시 인터넷 환경 고려 필요'],

SLIDES.push({part:1, kicker:'Part 1 · 개요', title:'프로젝트 배경', type:'bullets', items:[
  T('고령화 심화로 어르신 삶의 기록이 보존되지 못한 채 소실되는 경우 증가'),

SLIDES.push({part:1, kicker:'Part 1 · 개요', title:'프로젝트 목적 & 핵심 차별점', type:'bullets', items:[

/* ============================================================
   RENDER ENGINE
   ============================================================ */
function header(s){
  return `<div class="hd"><p class="kicker">${s.kicker||''}</p><h1 class="title">${s.title}</h1>${s.subtitle?`<p class="subtitle">${s.subtitle}</p>`:''}</div>`;
}
function noteHtml(s){ return s.note ? `<div class="note">${s.note}</div>` : ''; }

function renderTitle(s){
  return `<div class="full-center">
    <div class="mark">${LOGO_SVG(96,'var(--silver)','var(--teal)','var(--gold)')}</div>
    <p class="cover-eyebrow">${s.eyebrow}</p>
    <h1 class="cover-title">${s.title}</h1>
    <p class="cover-sub">${s.sub}</p>
    <p class="cover-desc">${s.desc}</p>
  </div>
  <div class="cover-meta">${s.meta}</div>`;
}
function renderClosing(s){
  return `<div class="full-center">
    <div class="mark">${LOGO_SVG(96,'var(--silver)','var(--teal)','var(--gold)')}</div>
    <h1 class="cover-title" style="font-size:88px;">${s.title}</h1>
    <p class="cover-sub">${s.sub}</p>
  </div>
  <div class="cover-meta">${s.meta}</div>`;
}
function renderSection(s){
  return `<div class="full-center">
    <p class="sec-no">${s.no}</p>
    <h1 class="sec-title">${s.title}</h1>
    <p class="sec-sub">${s.sub}</p>
    <div class="sec-rule"></div>
  </div>`;
}
function renderAgenda(s){
  const items = s.items.map((it,i)=>`<div class="agenda-item" data-step="${i}"><span class="agenda-no">${it.no}</span><span class="agenda-label">${it.label}</span></div>`).join('');
  return `${header(s)}<div class="agenda-grid">${items}</div>`;
}
function renderBullets(s){
  const items = s.items.map((it,i)=>`<li class="b-item lvl${it.level} tone-${it.tone}" data-step="${i}">${it.text}</li>`).join('');
  return `${header(s)}<div class="content"><ul class="b-list scrollarea">${items}</ul>${noteHtml(s)}</div>`;
}
function renderTwocol(s){
  let step = 0;
  const mk = (items) => items.map(it=>{const h=`<li class="b-item lvl${it.level} tone-${it.tone}" data-step="${step}">${it.text}</li>`; step++; return h;}).join('');
  return `${header(s)}<div class="content"><div class="twocol">
    <div class="col left"><p class="col-label">${s.left.label}</p><ul class="b-list scrollarea">${mk(s.left.items)}</ul></div>
    <div class="col right"><p class="col-label">${s.right.label}</p><ul class="b-list scrollarea">${mk(s.right.items)}</ul></div>
  </div>${noteHtml(s)}</div>`;
}
function renderTable(s){
  const ths = s.cols.map((c,i)=>`<th style="width:${s.colWidths?s.colWidths[i]:''}%">${c}</th>`).join('');
  const rows = s.rows.map((r,ri)=>{
    const step = s.revealRows ? ri : null;
    const tds = r.map(c=>`<td>${c}</td>`).join('');
    return `<tr${step!==null?` data-step="${step}"`:''}>${tds}</tr>`;
  }).join('');
  const tableAttr = s.revealRows ? '' : ' data-step="0"';
  return `${header(s)}<div class="content"><div class="tbl-wrap"><table class="dt"${tableAttr}><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table></div>${noteHtml(s)}</div>`;
}
function renderFlowV(s){
  const steps = s.steps.map((st,i)=>{
    const chevron = i < s.steps.length-1 ? `<div class="flow-chevron" data-step="${i}">▾</div>` : '';
    return `<div class="flow-step" data-step="${i}"><div class="flow-num">${i+1}</div><div class="flow-body"><p class="flow-title">${st.title}</p><p class="flow-desc">${st.desc}</p></div></div>${chevron}`;
  }).join('');
  return `${header(s)}<div class="content"><div class="flow-v">${steps}</div>${noteHtml(s)}</div>`;
}
function renderFlowH(s){
  const steps = s.steps.map((st,i)=>{
    const arrow = i < s.steps.length-1 ? `<div class="flow-h-arrow" data-step="${i}">→</div>` : '';
    return `<div class="flow-h-step" data-step="${i}"><div class="flow-h-badge">${i+1}</div><div class="flow-h-title">${st.title}</div><div class="flow-h-desc">${st.desc}</div></div>${arrow}`;
  }).join('');
  return `${header(s)}<div class="content" style="justify-content:center;"><div class="flow-h">${steps}</div>${noteHtml(s)}</div>`;
}
function renderDiagram(s){
  const SCALE_X = 1728/1920, SCALE_Y = 700/1080; // content viewport approx within stage below header
  const boxes = s.boxes.map((b,i)=>{
    const cls = 'dbox tone-'+(b.tone||'subtle');
    const sub = b.sub ? `<div class="sub">${b.sub.replace(/\n/g,'<br>')}</div>` : '';
    const main = b.text.replace(/\n/g,'<br>');
    return `<div class="${cls}" data-step="${b.g!=null?b.g:i}" style="left:${b.x*0.9}px; top:${b.y*0.65}px; width:${b.w*0.9}px; height:${b.h*0.65}px;">${main}${sub}</div>`;
  }).join('');
  let svgLines = '';
  if(s.arrows){
    svgLines = s.arrows.map(a=>{
      const step = a.g!=null?a.g:0;
      return `<line data-step="${step}" x1="${a.x1*0.9}" y1="${a.y1*0.65}" x2="${a.x2*0.9}" y2="${a.y2*0.65}" stroke="var(--gold)" stroke-width="4" marker-end="url(#arrowhead)"/>`;
    }).join('');
  }
  const svg = `<svg viewBox="0 0 1728 702"><defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="var(--gold)"/></marker></defs>${svgLines}</svg>`;
  return `${header(s)}<div class="content"><div class="diagram">${svg}${boxes}</div>${noteHtml(s)}</div>`;
}
function renderCode(s){
  return `${header(s)}<div class="content"><div class="code-wrap" data-step="0"><pre>${s.code}</pre></div>${noteHtml(s)}</div>`;
}
function renderSwatches(s){
  const chips = s.swatches.map(sw=>`<div class="swatch"><div class="swatch-chip" style="background:${sw.hex}"></div><div class="swatch-name">${sw.name}</div><div class="swatch-hex">${sw.hex} · ${sw.label}</div></div>`).join('');
  const rows = s.typeScale.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');
  return `${header(s)}<div class="content" data-step="0"><div class="swatch-row">${chips}</div>
    <div class="tbl-wrap" style="flex:0 0 auto;"><table class="dt"><thead><tr><th>레벨</th><th>크기/굵기</th><th>서체</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

function renderSlide(s){
  switch(s.type){
    case 'title': return renderTitle(s);
    case 'closing': return renderClosing(s);
    case 'section': return renderSection(s);
    case 'agenda': return renderAgenda(s);
    case 'bullets': return renderBullets(s);
    case 'twocol': return renderTwocol(s);
    case 'table': return renderTable(s);
    case 'flow': return s.direction==='horizontal' ? renderFlowH(s) : renderFlowV(s);
    case 'diagram': return renderDiagram(s);
    case 'code': return renderCode(s);
    case 'swatches': return renderSwatches(s);
    default: return '<div>Unknown slide type</div>';
  }
}

/* ============================================================
   NAVIGATION ENGINE
   ============================================================ */
let current = 0;
let step = -1;
const root = document.getElementById('slide-root');
const stage = document.getElementById('stage');

function totalStepsOf(el){
  const nums = Array.from(el.querySelectorAll('[data-step]')).map(e=>parseInt(e.dataset.step,10));
  return nums.length ? Math.max(...nums)+1 : 0;
}

function paint(el){
  el.querySelectorAll('[data-step]').forEach(e=>{
    const n = parseInt(e.dataset.step,10);
    e.classList.toggle('shown', n <= step);
  });
}

function renderCurrent(instant){
  const s = SLIDES[current];
  const div = document.createElement('div');
  div.className = 'slide';
  div.innerHTML = renderSlide(s);
  root.innerHTML = '';
  root.appendChild(div);
  paint(div);
  requestAnimationFrame(()=>{ div.classList.add('active'); });
  document.getElementById('part-no').textContent = String(s.part).padStart(2,'0');
  document.getElementById('part-name').textContent = PARTS[s.part];
  document.getElementById('counter').textContent = (current+1) + ' / ' + SLIDES.length;
  document.getElementById('progress-fill').style.width = (((current+1)/SLIDES.length)*100) + '%';
}

function goNext(){
  const el = root.querySelector('.slide');
  const total = totalStepsOf(el);
  if(step < total-1){ step++; paint(el); }
  else if(current < SLIDES.length-1){ current++; step=-1; renderCurrent(); }
}
function goPrev(){
  if(step >= 0){ step--; const el=root.querySelector('.slide'); paint(el); }
  else if(current > 0){ current--; renderCurrent(); const el=root.querySelector('.slide'); step = totalStepsOf(el)-1; paint(el); }
}

document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight' || e.key===' ' || e.key==='PageDown'){ e.preventDefault(); goNext(); }
  else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); goPrev(); }
  else if(e.key==='Home'){ current=0; step=-1; renderCurrent(); }
  else if(e.key==='End'){ current=SLIDES.length-1; step=-1; renderCurrent(); }
  else if(e.key==='Escape'){ toggleFullscreen(); }
});
document.getElementById('btn-next').addEventListener('click', goNext);
document.getElementById('btn-prev').addEventListener('click', goPrev);

function toggleFullscreen(){
  try{
    if(!document.fullscreenElement){ document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
    else{ document.exitFullscreen && document.exitFullscreen(); }
  }catch(err){}
}
document.getElementById('btn-full').addEventListener('click', toggleFullscreen);

function fitStage(){
  const scale = Math.min(window.innerWidth/1920, window.innerHeight/1080);
  stage.style.transform = 'scale('+scale+')';
}
window.addEventListener('resize', fitStage);
fitStage();
renderCurrent();
</script>
