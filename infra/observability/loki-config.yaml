# Loki 단일 프로세스(로컬 개발) 설정 — decisions.md #61(2026-09-12 사용자 결정, I4).
# 공식 최소 구성(github.com/grafana/loki cmd/loki/loki-local-config.yaml)을
# 기반으로 이 프로젝트에 불필요한 부분(pattern_ingester·ruler·frontend 캐시)만 뺐다.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
