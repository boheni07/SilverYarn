# Grafana 데이터소스 자동 프로비저닝 — decisions.md #61(I4). Keycloak realm
# 자동 임포트(infra/keycloak/import/)와 동일한 취지: docker compose up만으로
# 바로 쓸 수 있는 상태로 뜨게 한다(수동 설정 최소화).
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
