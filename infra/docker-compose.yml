# 로컬 개발용 인프라 — structure.md §1, CONVENTIONS.md §4 접두사와 매핑
# 온프레미스 실 배포(K8s/베어메탈)는 infra/k8s/(아직 스캐폴딩 전, infra-architect 상담 대기)와 별개.
# 프로덕션 시크릿은 이 파일에 두지 않는다 — 아래 값은 로컬 개발 전용 기본값이다.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: silveryarn
      POSTGRES_USER: silveryarn
      POSTGRES_PASSWORD: silveryarn_local_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silveryarn"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # arq 잡 큐 (sync-contract.md §2 비동기 처리 계약)
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    # VECTORDB_ — 하이브리드 서치(BM25+Dense), decisions.md #28
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    # GRAPH_ — 지식그래프, decisions.md #29
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: neo4j/silveryarn_local_dev
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  minio:
    # STORAGE_ — 원본 음성·완성 PDF/ePub, sync-contract.md §4 Presigned URL
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: silveryarn
      MINIO_ROOT_PASSWORD: silveryarn_local_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  minio_data:
