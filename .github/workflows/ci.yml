name: CI

# CONVENTIONS.md §1.3/§0.1 검증 명령을 그대로 자동화한다 — 이 세션 내내 수동으로
# 돌려 온 `ruff check`/`ruff format --check`/`mypy`/`pytest`(backend)와
# `npm run lint`/`type-check`/`build`(apps/web, apps/admin)를 push/PR마다 실행한다.
#
# 실 인프라(Postgres/Redis/Qdrant/Neo4j/MinIO) 없이 돌아간다는 전제 — 지금 backend
# 테스트는 전부 Fake*Repository로 Application 계층만 검증하고(services/backend/tests의
# 모든 test_*_service.py), 실 DB e2e 검증은 이 세션에서처럼 로컬 docker-compose로
# 사람이 직접 돌린다. apps/mobile은 아직 스캐폴딩 전이라 job이 없다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: services/backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # pyproject.toml requires-python 하한과 동일
          cache: "pip"
          cache-dependency-path: services/backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: ruff check
        run: python -m ruff check .

      - name: ruff format --check
        run: python -m ruff format --check .

      - name: mypy
        run: python -m mypy src

      - name: pytest
        run: python -m pytest -q
        env:
          PYTHONPATH: src

  web:
    name: apps/web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build

  admin:
    name: apps/admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/admin/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
